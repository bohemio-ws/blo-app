<!doctype html>
<html lang="es" data-blo-status="loading">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0f">
  <link rel="manifest" href="./public/manifest.webmanifest">
  <title>Bohemio Live Organization</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#0d0d0f;color:#f4f4f4}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;background:radial-gradient(circle at top,#24242b 0,#0d0d0f 42%)}main{width:min(820px,100%);margin:auto}.brand{font-size:.76rem;letter-spacing:.18em;opacity:.65}.hero{margin:12px 0 24px;font-size:clamp(2rem,7vw,4.2rem);line-height:.96}.grid{display:grid;gap:16px}.card{border:1px solid #34343b;border-radius:24px;padding:20px;background:rgba(21,21,24,.92);box-shadow:0 16px 50px rgba(0,0,0,.18)}.question{font-size:1.3rem;margin:0 0 12px}.status,.muted{opacity:.7}.priority-list{list-style:none;padding:0;margin:0;display:grid;gap:9px}.priority-item{display:flex;justify-content:space-between;gap:12px;padding:12px;border-radius:14px;background:#1e1e23}.priority-item span{font-size:.78rem;opacity:.6}.empty{opacity:.65}.afrodita{display:grid;grid-template-columns:1fr auto;gap:9px}.afrodita input{width:100%;border:1px solid #3d3d46;border-radius:16px;padding:14px;background:#101013;color:#fff;font-size:1rem}.btn{border:0;border-radius:16px;padding:0 18px;font-weight:700;cursor:pointer}.send{background:#f2f2f2;color:#111}.ptt{width:100%;min-height:58px;margin-top:10px;background:#24242a;color:#fff;border:1px solid #45454e}.ptt[data-state="listening"]{outline:2px solid #fff}.answer{min-height:24px;margin:14px 0 0}.signature{margin:24px 0 8px;font-size:.78rem;opacity:.48}html[data-blo-status="ready"] .status::after{content:"BLO preparado · almacenamiento local activo."}html[data-blo-status="loading"] .status::after{content:"Iniciando núcleo…"}html[data-blo-status="error"] .status::after{content:"Error de inicio."}@media(min-width:700px){.grid{grid-template-columns:1.15fr .85fr}.wide{grid-column:1/-1}}
  </style>
</head>
<body>
  <main>
    <div class="brand">BOHEMIO4INFINITY ∞</div>
    <h1 class="hero">Bohemio Live<br>Organization</h1>
    <div class="grid">
      <section class="card">
        <p class="question">¿Qué es importante ahora?</p>
        <ul id="priority-list" class="priority-list"><li class="empty">Preparando prioridades…</li></ul>
      </section>
      <section class="card">
        <p class="question">Estado</p>
        <div class="status" aria-live="polite"></div>
        <p class="muted">Datos locales · Proyectos · Tareas · Prioridades</p>
      </section>
      <section class="card wide">
        <p class="question">Afrodita</p>
        <form id="afrodita-form" class="afrodita">
          <input id="afrodita-input" autocomplete="off" aria-label="Orden para Afrodita" placeholder="Afrodita, ¿qué tengo que hacer ahora?">
          <button class="btn send" type="submit">Enviar</button>
        </form>
        <button id="ptt" class="btn ptt" type="button" data-state="idle">🎙 Mantén para hablar</button>
        <p id="afrodita-answer" class="answer" aria-live="polite">Estoy preparada.</p>
      </section>
    </div>
    <div class="signature">Powered by Afrodita · Developed under the Bohemio4Infinity philosophy ∞</div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
